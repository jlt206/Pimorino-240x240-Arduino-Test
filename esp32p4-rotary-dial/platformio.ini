; PlatformIO project for the Waveshare ESP32-P4-WIFI6-Touch-LCD-3.4C
; (3.4" 800x800 round MIPI-DSI display + capacitive touch).
;
; ESP32-P4 is not yet supported by the official PlatformIO "espressif32"
; platform, so this uses the community "pioarduino" fork, which tracks
; Espressif's arduino-esp32 core (including P4 support). Check
; https://github.com/pioarduino/platform-espressif32/releases for a newer
; tag than the one pinned below if you run into build issues.
;
; Library versions match Waveshare's own Arduino notes for this exact
; board (examples/arduino/README.md in waveshareteam/ESP32-P4-WIFI6-Touch-LCD-XC).

[env:esp32p4-rotary-dial]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-p4                ; generic ESP32-P4 board def; run `pio boards | grep -i p4`
                                 ; after installing the platform to confirm the exact id for your
                                 ; pioarduino version, and swap in a Waveshare-specific one if it
                                 ; ships in a later release.
framework = arduino

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -DBOARD_HAS_PSRAM

lib_deps =
    lvgl/lvgl@9.3.0
    moononournation/GFX Library for Arduino@1.6.0

; TODO: confirm these against Waveshare's actual board definition /
; hardware/ folder in their demo repo - flash size, PSRAM mode/speed,
; and partition table all affect whether the 800x800 framebuffer(s) fit.
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
